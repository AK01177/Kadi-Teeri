[project]
name = "kadi-teeri"
version = "0.1.0"
description = "Real-time multiplayer Indian trick-taking card game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.11.0",
    "websockets>=12.0",
    "supabase>=2.3.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]
